# Lint, type-check, test, and build both apps on every PR to main and every
# push to main. No secrets: backend e2e is out (it boots AppModule, which needs
# Supabase), and the frontend build only needs placeholder Supabase env.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Not secrets: just enough for @nuxtjs/supabase to build.
    env:
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_KEY: placeholder-anon-key
      API_BASE: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # postinstall runs `nuxt prepare`, which generates the .nuxt tsconfigs typecheck needs.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
